name: Validate plugin manifests

on:
  # No paths filter on pull_request: this job is a required status check on main,
  # and a path-filtered required check never reports on PRs outside its paths,
  # leaving them permanently unmergeable without an admin bypass.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'plugins/**/plugin.json'
      - 'plugins/grc-diagrams/**'
      - '.claude-plugin/marketplace.json'
      - 'schemas/plugin.schema.json'
      - 'schemas/marketplace.schema.json'
      - 'tests/schema-validator.test.mjs'
      - 'tests/validate-json-schema.cjs'
      - 'tests/validate-plugin-manifests.sh'
      - 'tests/validate-grc-diagram-skills.sh'
      - 'package.json'
      - '.github/workflows/validate-plugin-manifests.yml'

permissions:
  contents: read

concurrency:
  group: validate-plugin-manifests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifests:
    name: Validate plugin and marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test schema validator
        run: npm run test:schema-validator

      - name: Validate every plugin and marketplace manifest
        run: bash tests/validate-plugin-manifests.sh

      - name: Validate GRC diagram skills
        run: bash tests/validate-grc-diagram-skills.sh
