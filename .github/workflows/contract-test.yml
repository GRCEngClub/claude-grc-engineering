name: Contract test

on:
  # No paths filter on pull_request: this job is a required status check on main,
  # and a path-filtered required check never reports on PRs outside its paths,
  # leaving them permanently unmergeable without an admin bypass.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-fixtures:
    name: Validate contract fixtures against every schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test schema validator
        run: npm run test:schema-validator

      - name: Run unit test suites
        run: npm run test:unit

      - name: Validate contract fixtures
        run: bash tests/validate-contract-fixtures.sh
