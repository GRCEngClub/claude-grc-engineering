name: Contract test

on:
  # No paths filter on pull_request: this job is a required status check on main,
  # and a path-filtered required check never reports on PRs outside its paths,
  # leaving them permanently unmergeable without an admin bypass.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-fixtures:
    name: Validate contract fixtures against every schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test schema validator
        run: npm run test:schema-validator

      - name: Install pinned OPA
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/opa" https://github.com/open-policy-agent/opa/releases/download/v1.22.4/opa_linux_amd64_static
          echo '35e3b352e715e80624ead6c89930d8585f6f7d94cdc409eb2a9fe36620dcccba  '"$RUNNER_TEMP/opa" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/opa"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run unit test suites
        env:
          REQUIRE_OPA: '1'
        run: npm run test:unit

      - name: Test NIST evidence collectors
        run: python3 tests/nist-evidence-collectors.test.py

      - name: Validate contract fixtures
        run: bash tests/validate-contract-fixtures.sh
