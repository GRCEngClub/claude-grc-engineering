# FedRAMP 20x Key Security Indicators (KSIs)
#
# Generated from FedRAMP's machine-readable Consolidated Rules for 2026 (CR26),
# dataset version 2026.11.02.01, last updated 2026-11-02:
#   https://github.com/FedRAMP/rules (file fedramp-consolidated-rules.json,
#   path KSI.<THEME>.indicators.<KSI-ID>)
# When FedRAMP publishes a new dataset version, update this file from the dataset.
# Copy the FedRAMP fields from the dataset. Do not paraphrase them.
#
# Copied from FedRAMP without change:
#   - theme codes and names, KSI IDs
#   - title (the KSI name) and description (the KSI statement)
#   - statements_by_class, where FedRAMP gives a different statement per class
#   - nist_mapping (the KSI's "controls" array, rewritten from ac-2.13 to AC-2(13))
#   - updated (the date of the KSI's newest change entry)
#
# Derived from FedRAMP data by this toolkit:
#   - classes, the 20x Certification Class applicability of each KSI:
#       a: named      the KSI is in the Class A list of rule FRC-CLA-MFR
#          not_named  it is not in that list
#       b: required   the KSI applies to Class B and is not marked Optional
#          optional   its Class B statement begins with "Optional:"
#       c: required   the KSI applies to Class C
#     FedRAMP gives KSIs no MUST or SHOULD force. "required" here means only
#     "applies to this class and is not marked Optional". FedRAMP has not defined
#     the KSIs for 20x Class D yet, so there is no "d" key.
#   - categories.<CODE>.description (the names of the theme's indicators; the
#     dataset has no theme descriptions)
#
# This toolkit's own work, not FedRAMP's:
#   - every cloud_tests block. These are illustrative cloud CLI commands that can
#     help a provider start gathering information about a KSI. FedRAMP defines no
#     tests, commands or pass criteria for KSIs. A KSI that has a cloud_tests block
#     is not verified or validated by running it, and many KSIs have none.

name: FedRAMP 20x Key Security Indicators
version: "2026.11.02.01"
last_updated: "2026-11-02"
description: |
  The Key Security Indicators (KSIs) in FedRAMP's Consolidated Rules for 2026 (CR26):
  10 themes and 46 indicators. Each KSI is a statement of a security capability that a
  provider addresses for a FedRAMP 20x Certification. KSIs apply to the 20x
  Certification Type only. Rev5 certifications use the control lists in
  fedramp-low.yaml, fedramp-moderate.yaml and fedramp-high.yaml instead.

source: https://github.com/FedRAMP/rules
reference:
  dataset: https://raw.githubusercontent.com/FedRAMP/rules/2026.11.02.01/fedramp-consolidated-rules.json
  dataset_path: KSI.<THEME>.indicators.<KSI-ID>
  human_readable: https://www.fedramp.gov/2026/reference/key-security-indicators/

applicable_to:
  - Providers seeking or holding a FedRAMP 20x Certification (Class A, B or C)

class_summary:
  a:
    indicators: 7
    source_rule: FRC-CLA-MFR
  b:
    indicators: 46
    optional: 5
  c:
    indicators: 46
    optional: 0

cloud_tests_note: >-
  cloud_tests blocks are this toolkit's illustrative checks, not FedRAMP-defined
  tests. FedRAMP defines no commands or pass criteria for KSIs.

categories:
  CED:
    id: KSI-CED
    name: "Cybersecurity Education"
    description: "Indicators: Reviewing All Training"
    indicator_count: 1
    status: stable
  CMT:
    id: KSI-CMT
    name: "Change Management"
    description: "Indicators: Logging Changes; Redeploying vs Modifying; Reviewing Change Procedures; Validating Throughout Deployment"
    indicator_count: 4
    status: stable
  CNA:
    id: KSI-CNA
    name: "Cloud Native Architecture"
    description: "Indicators: Defining Functionality and Privileges; Enforcing Intended State; Implementing Best Practices; Minimizing Attack Surface; Optimizing for Availability; Restricting Network Traffic; Reviewing Protections; Using Logical Networking"
    indicator_count: 8
    status: stable
  IAM:
    id: KSI-IAM
    name: "Identity and Access Management"
    description: "Indicators: Automating Account Management; Adopting Passwordless Methods; Ensuring Least Privilege; Authorizing Just-in-Time; Securing Non-User Authentication; Responding to Suspicious Activity"
    indicator_count: 6
    status: stable
  INR:
    id: KSI-INR
    name: "Incident Response"
    description: "Indicators: Generating After Action Reports; Reviewing Incident Response Procedures; Reviewing Past Incidents"
    indicator_count: 3
    status: stable
  MLA:
    id: KSI-MLA
    name: "Monitoring, Logging, and Auditing"
    description: "Indicators: Authorizing Log Access; Evaluating Configurations; Logging Event Types; Operating SIEM Capability; Reviewing Logs"
    indicator_count: 5
    status: stable
  PIY:
    id: KSI-PIY
    name: "Policy and Inventory"
    description: "Indicators: Generating Inventories; Reviewing Executive Support; Reviewing Investments in Security; Reviewing Security in the SDLC; Reviewing Vulnerability Disclosures"
    indicator_count: 5
    status: stable
  RPL:
    id: KSI-RPL
    name: "Recovery Planning"
    description: "Indicators: Aligning Backups with Objectives; Aligning Recovery Plan; Reviewing Recovery Objectives; Testing Recovery Capabilities"
    indicator_count: 4
    status: stable
  SCR:
    id: KSI-SCR
    name: "Supply Chain Risk"
    description: "Indicators: Mitigating Supply Chain Risk; Monitoring Supply Chain Risk"
    indicator_count: 2
    status: stable
  SVC:
    id: KSI-SVC
    name: "Service Configuration"
    description: "Indicators: Automating Configuration Management; Automating Secret Management; Evaluating and Improving Security; Preventing Residual Risk; Removing Unwanted Data; Securing Information; Validating Communications; Validating Resource Integrity"
    indicator_count: 8
    status: stable

controls:
  KSI-CED-RAT:
    title: "Reviewing All Training"
    description: "The effectiveness of relevant cybersecurity education and training is persistently reviewed, including at least general training for all employees, role-specific training for employees in high risk roles, training for development and engineering staff on secure software delivery, and training for staff involved with incident response or disaster recovery."
    category: CED
    nist_mapping: [AT-2, AT-2(2), AT-2(3), AT-3, AT-3(5), AT-4, CM-11, CP-3, CP-3(1), IR-2, IR-2(1), IR-2(2), IR-2(3), IR-9(2), IR-9(4), PL-4, PL-4(1), PS-6, SR-11(1)]
    classes: { a: named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws iam list-users"
            description: "List IAM users (the population to compare with general training records)"
          - cmd: "aws iam get-account-authorization-details --filter User --query 'UserDetailList[?AttachedManagedPolicies[?PolicyName==`AdministratorAccess`]].UserName'"
            description: "List users with AdministratorAccess (a population to compare with role-specific training records)"

  KSI-CMT-LMC:
    title: "Logging Changes"
    description: "Modifications to the cloud service offering are logged and monitored."
    category: CMT
    nist_mapping: [AU-2, CA-7(4), CM-3, CM-3(1), CM-3(2), CM-3(6), CM-4(2), CM-6, CM-8(3)]
    classes: { a: named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws cloudtrail describe-trails"
            description: "Check CloudTrail for change logging"
          - cmd: "aws config describe-configuration-recorder-status"
            description: "Check Config recorder"
        evidence_script: |
          #!/bin/bash
          echo "=== KSI-CMT-LMC Logging Changes ==="
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""
          echo "=== CloudTrail Status ==="
          aws cloudtrail describe-trails --query 'trailList[*].{Name:Name,IsMultiRegion:IsMultiRegionTrail,IsOrganizationTrail:IsOrganizationTrail}' --output table
          echo ""
          echo "=== Config Recorder Status ==="
          aws config describe-configuration-recorder-status --output table
      azure:
        commands:
          - cmd: "az monitor activity-log list --max-events 10"
            description: "Check activity logging"
      gcp:
        commands:
          - cmd: "gcloud logging sinks list"
            description: "List logging sinks"

  KSI-CMT-RMV:
    title: "Redeploying vs Modifying"
    description: "Changes to machine-based information resources are executed through the redeployment of version controlled resources rather than direct modification wherever reasonable."
    category: CMT
    nist_mapping: [CM-2, CM-3, CM-5, CM-6, CM-7, CM-8(1), SI-3]
    classes: { a: not_named, b: required, c: required }
    updated: "2026-06-24"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws ecr describe-repositories"
            description: "List container repositories"
          - cmd: "aws cloudformation list-stacks --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE"
            description: "List CloudFormation stacks"
      azure:
        commands:
          - cmd: "az acr list"
            description: "List container registries"
      gcp:
        commands:
          - cmd: "gcloud container images list"
            description: "List container images"

  KSI-CMT-RVP:
    title: "Reviewing Change Procedures"
    description: "The effectiveness of documented change management procedures is persistently reviewed."
    category: CMT
    nist_mapping: [CM-3, CM-3(2), CM-3(4), CM-5, CM-7(1), CM-9]
    classes: { a: not_named, b: required, c: required }
    updated: "2026-06-24"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws ssm list-documents --document-filter-list key=DocumentType,value=Automation"
            description: "List SSM automation documents"

  KSI-CMT-VTD:
    title: "Validating Throughout Deployment"
    description: "Persistent testing and validation of changes throughout deployment is automated."
    category: CMT
    nist_mapping: [CM-3, CM-3(2), CM-4(2), CM-6(2), IR-9(4), SI-2]
    classes: { a: not_named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws codepipeline list-pipelines"
            description: "List CI/CD pipelines"
          - cmd: "aws codebuild list-projects"
            description: "List CodeBuild projects"

  KSI-CNA-DFP:
    title: "Defining Functionality and Privileges"
    description: "The functionality and privileges for infrastructure and services are strictly defined."
    category: CNA
    nist_mapping: [CM-2, CM-8(4), CP-10(4), IR-9(4), SI-3]
    classes: { a: not_named, b: required, c: required }
    updated: "2026-10-13"

  KSI-CNA-EIS:
    title: "Enforcing Intended State"
    description: "Automated services are used to persistently assess the security of all machine-based information resources and automatically enforce their intended operational state."
    category: CNA
    nist_mapping: [CA-2(1), CM-11, CM-6(2), CP-10(4), IR-9(4), SC-24, SC-7(18), SI-4(22), SI-7, SI-7(1), SI-7(5), SI-7(7)]
    classes: { a: not_named, b: optional, c: required }
    statements_by_class:
      b: "**Optional:** Automated services are used to persistently assess the security of all machine-based information resources and automatically enforce their intended operational state."
      c: "Automated services are used to persistently assess the security of all machine-based information resources and automatically enforce their intended operational state."
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws securityhub get-findings --max-items 10"
            description: "Check Security Hub findings"
          - cmd: "aws config describe-config-rules"
            description: "List Config rules"
          - cmd: "aws guardduty list-detectors"
            description: "Check GuardDuty detectors"
        evidence_script: |
          #!/bin/bash
          echo "=== KSI-CNA-EIS Enforcing Intended State ==="
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""
          echo "=== Security Hub Status ==="
          aws securityhub describe-hub 2>/dev/null || echo "Security Hub NOT ENABLED"
          echo ""
          echo "=== Config Rules ==="
          aws config describe-config-rules --query 'ConfigRules[*].{Name:ConfigRuleName,State:ConfigRuleState}' --output table
          echo ""
          echo "=== GuardDuty Status ==="
          DETECTOR=$(aws guardduty list-detectors --query 'DetectorIds[0]' --output text)
          if [ "$DETECTOR" != "None" ] && [ -n "$DETECTOR" ]; then
            aws guardduty get-detector --detector-id $DETECTOR --query '{Status:Status}'
          else
            echo "GuardDuty NOT ENABLED"
          fi
      azure:
        commands:
          - cmd: "az security secure-scores list"
            description: "Check secure scores"
      gcp:
        commands:
          - cmd: "gcloud scc sources list ORGANIZATION"
            description: "List SCC sources"

  KSI-CNA-IBP:
    title: "Implementing Best Practices"
    description: "The use and configuration of third-party machine-based information resources is persistently compared against the original provider's best practices and guidance."
    category: CNA
    nist_mapping: [AC-17(3), CM-2, PL-10, SC-7(18)]
    classes: { a: not_named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws support describe-trusted-advisor-checks --language en"
            description: "List Trusted Advisor checks"
          - cmd: "aws securityhub get-enabled-standards"
            description: "Check enabled standards"

  KSI-CNA-MAT:
    title: "Minimizing Attack Surface"
    description: "Machine-based information resources are persistently reviewed to ensure they have a minimal attack surface and that lateral movement is minimized if compromised."
    category: CNA
    nist_mapping: [AC-17(3), AC-18(1), AC-18(3), AC-20(1), CA-9, SC-10, SC-7(18), SC-7(3), SC-7(4), SC-7(5), SC-7(8), SC-8, SI-10, SI-11, SI-16]
    classes: { a: not_named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws ec2 describe-instances --query 'Reservations[*].Instances[*].{Id:InstanceId,PublicIp:PublicIpAddress}'"
            description: "Check for public IP assignments"
          - cmd: "aws elbv2 describe-load-balancers --query 'LoadBalancers[*].{Name:LoadBalancerName,Scheme:Scheme}'"
            description: "Check load balancer exposure"

  KSI-CNA-OFA:
    title: "Optimizing for Availability"
    description: "Machine-based information resources are persistently reviewed to ensure they are appropriately optimized for high availability and rapid recovery."
    category: CNA
    nist_mapping: [CP-2(5), SC-12(1)]
    classes: { a: not_named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws rds describe-db-instances --query 'DBInstances[*].{Id:DBInstanceIdentifier,MultiAZ:MultiAZ}'"
            description: "Check RDS Multi-AZ"
          - cmd: "aws autoscaling describe-auto-scaling-groups --query 'AutoScalingGroups[*].{Name:AutoScalingGroupName,MinSize:MinSize,MaxSize:MaxSize}'"
            description: "Check Auto Scaling"

  KSI-CNA-RNT:
    title: "Restricting Network Traffic"
    description: "Machine-based information resources are persistently reviewed to ensure they are appropriately configured to limit inbound and outbound network traffic."
    category: CNA
    nist_mapping: [AC-17(3), CA-9, CM-7(1), SC-7(10), SC-7(18), SC-7(20), SC-7(21), SC-7(5), SI-10, SI-4(11), SI-4(18), SI-4(4), SI-8]
    classes: { a: named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws ec2 describe-security-groups --query 'SecurityGroups[*].{GroupId:GroupId,GroupName:GroupName,IngressRules:IpPermissions}'"
            description: "Review security group rules"
          - cmd: "aws ec2 describe-network-acls"
            description: "Check network ACLs"
          - cmd: "aws ec2 describe-flow-logs"
            description: "Check VPC Flow Logs"
        evidence_script: |
          #!/bin/bash
          echo "=== KSI-CNA-RNT Restricting Network Traffic ==="
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""
          echo "=== Security Groups with Open Ingress (0.0.0.0/0) ==="
          aws ec2 describe-security-groups --query 'SecurityGroups[?IpPermissions[?IpRanges[?CidrIp==`0.0.0.0/0`]]].{GroupId:GroupId,GroupName:GroupName}' --output table
          echo ""
          echo "=== VPC Flow Logs ==="
          aws ec2 describe-flow-logs --query 'FlowLogs[*].{Id:FlowLogId,Status:FlowLogStatus,VPC:ResourceId}' --output table
          echo ""
          echo "=== Security Groups Allowing SSH from Anywhere ==="
          aws ec2 describe-security-groups --filters "Name=ip-permission.from-port,Values=22" "Name=ip-permission.cidr,Values=0.0.0.0/0" --query 'SecurityGroups[*].{GroupId:GroupId,GroupName:GroupName}' --output table
      azure:
        commands:
          - cmd: "az network nsg list --query '[].{Name:name,Rules:securityRules[*].{Name:name,Direction:direction,Access:access}}'"
            description: "List NSG rules"
      gcp:
        commands:
          - cmd: "gcloud compute firewall-rules list --format='table(name,direction,allowed,sourceRanges)'"
            description: "List firewall rules"

  KSI-CNA-RVP:
    title: "Reviewing Protections"
    description: "The effectiveness of protection against denial of service attacks and other unwanted activity for machine-based information resources is persistently reviewed."
    category: CNA
    nist_mapping: [IR-4(2), SC-5, SC-7(18), SI-8, SI-8(2)]
    classes: { a: not_named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws shield describe-subscription"
            description: "Check Shield subscription"
          - cmd: "aws wafv2 list-web-acls --scope REGIONAL"
            description: "List WAF web ACLs"
      azure:
        commands:
          - cmd: "az network ddos-protection list"
            description: "List DDoS protection plans"
      gcp:
        commands:
          - cmd: "gcloud compute security-policies list"
            description: "List Cloud Armor policies"

  KSI-CNA-ULN:
    title: "Using Logical Networking"
    description: "Logical networking and related capabilities are used and persistently reviewed to enforce traffic flow controls."
    category: CNA
    nist_mapping: [AC-12, AC-17(3), AC-4(21), CA-9, CM-11, SC-10, SC-4, SC-7, SC-7(20), SC-7(21), SC-7(7), SC-8]
    classes: { a: not_named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws ec2 describe-vpcs --query 'Vpcs[*].{VpcId:VpcId,CidrBlock:CidrBlock}'"
            description: "List VPCs"
          - cmd: "aws ec2 describe-subnets --query 'Subnets[*].{SubnetId:SubnetId,VpcId:VpcId,CidrBlock:CidrBlock,MapPublicIpOnLaunch:MapPublicIpOnLaunch}'"
            description: "Check subnet configuration"

  KSI-IAM-AAM:
    title: "Automating Account Management"
    description: "The lifecycle and privileges of all accounts, roles, and groups are securely managed using automation."
    category: IAM
    nist_mapping: [AC-2(13), AC-2(2), AC-2(3), AC-6(7), IA-12, IA-12(2), IA-12(3), IA-12(5), IA-4(4), IA-8(4)]
    classes: { a: named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws lambda list-functions --query 'Functions[?contains(FunctionName,`iam`) || contains(FunctionName,`access`)].FunctionName'"
            description: "Check for IAM automation functions"

  KSI-IAM-APM:
    title: "Adopting Passwordless Methods"
    description: "Secure passwordless methods are used for user authentication and authorization when feasible, otherwise strong passwords with phishing-resistant MFA is used."
    category: IAM
    nist_mapping: [AC-2, AC-3, IA-2, IA-2(1), IA-2(2), IA-2(6), IA-2(8), IA-5, IA-5(1), IA-5(2), IA-5(6), IA-5(8), IA-6, IA-8, IA-8(2), IA-8(4), SC-23]
    classes: { a: named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws iam list-virtual-mfa-devices"
            description: "List MFA devices"
          - cmd: "aws iam get-credential-report"
            description: "Get credential report for MFA status"
          - cmd: "aws iam get-account-password-policy"
            description: "Check password policy"
        evidence_script: |
          #!/bin/bash
          echo "=== KSI-IAM-APM Adopting Passwordless Methods ==="
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""
          echo "=== MFA Devices ==="
          aws iam list-virtual-mfa-devices --query 'VirtualMFADevices[*].{User:User.UserName,SerialNumber:SerialNumber}' --output table
          echo ""
          echo "=== Users Without MFA ==="
          aws iam generate-credential-report >/dev/null 2>&1
          sleep 5
          aws iam get-credential-report --query 'Content' --output text | base64 -d | awk -F',' 'NR>1 && $8=="false" {print $1": NO MFA"}'
          echo ""
          echo "NOTE: compare this output with the KSI-IAM-APM statement (passwordless where feasible, otherwise strong passwords with phishing-resistant MFA)"
      azure:
        commands:
          - cmd: "az ad conditional-access policy list"
            description: "Check MFA enforcement policies"

  KSI-IAM-ELP:
    title: "Ensuring Least Privilege"
    description: "Identity and access management measures are used and persistently reviewed to ensure each user or device can only access the resources they need."
    category: IAM
    nist_mapping: [AC-12, AC-14, AC-17, AC-17(1), AC-17(2), AC-17(3), AC-18(4), AC-2(11), AC-2(5), AC-2(6), AC-2(7), AC-2(9), AC-20, AC-20(1), AC-21, AC-3, AC-4, AC-6, AC-6(3), AC-6(8), AU-12(3), AU-6(7), CM-2(7), CM-5(1), CM-5(5), CM-7(2), CM-9, IA-11, IA-2, IA-3, IA-4, IA-4(4), IA-5(2), IA-5(6), IR-4(6), IR-9(4), PS-2, PS-3, PS-4, PS-5, PS-6, RA-5(5), SC-2, SC-20, SC-21, SC-22, SC-23, SC-3, SC-39, SC-4, SI-3, SI-4(19)]
    classes: { a: not_named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws iam list-users --query 'Users[*].{UserName:UserName,CreateDate:CreateDate}'"
            description: "List users for access review"

  KSI-IAM-JIT:
    title: "Authorizing Just-in-Time"
    description: "A least-privileged, role and attribute-based, and just-in-time security authorization model is used and persistently reviewed for all user and non-user accounts and services."
    category: IAM
    nist_mapping: [AC-17, AC-17(4), AC-2, AC-2(1), AC-2(11), AC-2(2), AC-2(3), AC-2(4), AC-2(6), AC-2(7), AC-20(1), AC-21, AC-3, AC-4, AC-5, AC-6, AC-6(1), AC-6(10), AC-6(2), AC-6(3), AC-6(5), AC-6(7), AC-6(8), AC-6(9), AC-7, AU-10, AU-12(3), AU-9(4), CA-3(6), CM-5, CM-5(1), CM-5(5), CM-7, CM-7(2), CM-7(5), CM-9, IA-4, IA-4(4), IA-7, IR-4(6), PS-2, PS-3, PS-4, PS-5, PS-6, PS-9, RA-5(5), SC-2, SC-23, SC-3, SC-39]
    classes: { a: not_named, b: required, c: required }
    updated: "2026-10-13"
    cloud_tests:
      aws:
        commands:
          - cmd: "aws iam get-account-authorization-details --filter User"
            description: "Get user authorization details"
          - cmd: "aws iam list-attached-user-policies --user-name USER"
            description: "Check direct policy attachments"
        evidence_script: |
          #!/bin/bash
          echo "=== KSI-IAM-JIT Authorizing Just-in-Time ==="
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""
          echo "=== Users with AdministratorAccess ==="
          aws iam get-account-authorization-details --filter User --query 'UserDetailList[?AttachedManagedPolicies[?PolicyName==`AdministratorAccess`]].UserName' --output table
          echo ""
          echo "=== Users with Direct Policy Attachments ==="
          for user in $(aws iam list-users --query 'Users[*].UserName' --output text); do
            policies=$(aws iam list-attached-user-policies --user-name "$user" --query 'AttachedPolicies[*].PolicyName' --output text)
            if [ -n "$policies" ]; then
              echo "$user: $policies"
            fi
          done
          echo ""
          echo "NOTE (toolkit suggestion): prefer role assumption over direct user policies"
      azure:
        commands:
          - cmd: "az role assignment list --query '[].{Principal:principalName,Role:roleDefinitionName}'"
            description: "List role assignments"
      gcp:
        commands:
