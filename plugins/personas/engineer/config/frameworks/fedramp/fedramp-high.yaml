# FedRAMP Rev5 Class D control list
#
# The control IDs come from FedRAMP's machine-readable Consolidated Rules for 2026
# (CR26), dataset version 2026.11.02.01, rule FRC-CSF-BSL, Class D list:
#   https://github.com/FedRAMP/rules (file fedramp-consolidated-rules.json)
# When FedRAMP publishes a new dataset version, update this file from the dataset.
#
# The "notes" text is a short control title for readers. It is not FedRAMP text.
# Titles added in this revision are from the NIST SP 800-53 Rev. 5 catalog (release 5.2.0).
#
# The file name and the framework ID fedramp-high are kept so existing commands keep
# working. FedRAMP now names this list by Certification Class, not by impact level.

name: FedRAMP Rev5 Class D Baseline
version: Rev5
description: |
  The 409 NIST SP 800-53 Rev. 5 controls that a provider seeking a FedRAMP Rev5 Class D
  Certification must include, at a minimum, in its Security Decision Record (rule FRC-CSF-BSL).
  87 controls are listed here and 322 come from fedramp-moderate.yaml through "includes".
  Rev5 is FedRAMP's legacy Certification Type. Class D loosely aligns with the former High
  impact level, and FedRAMP says the two are not the same thing. FedRAMP stops accepting
  applications for new Rev5 Certifications on 2027-06-11.

source: https://github.com/FedRAMP/rules
dataset_version: "2026.11.02.01"
source_rule: FRC-CSF-BSL
certification_type: Rev5
certification_class: D
loosely_aligned_impact_level: High
control_count: 409
new_rev5_applications_end: "2027-06-11"
includes:
  - fedramp-moderate.yaml
applicable_to:
  - Providers seeking or holding a FedRAMP Rev5 Class D Certification

controls:
  AC-2(11): { required: true, notes: "Usage Conditions" }
  AC-4(4): { required: true, notes: "Flow Control of Encrypted Information" }
  AC-6(3): { required: true, notes: "Network Access to Privileged Commands" }
  AC-6(8): { required: true, notes: "Privilege Levels for Code Execution" }
  AC-10: { required: true, notes: "Concurrent Session Control" }
  AC-18(4): { required: true, notes: "Restrict Configurations by Users" }
  AC-18(5): { required: true, notes: "Antennas and Transmission Power Levels" }

  AU-5(1): { required: true, notes: "Storage Capacity Warning" }
  AU-5(2): { required: true, notes: "Real-time Alerts" }
  AU-6(4): { required: true, notes: "Central Review and Analysis" }
  AU-6(5): { required: true, notes: "Integrated Analysis of Audit Records" }
  AU-6(6): { required: true, notes: "Correlation with Physical Monitoring" }
  AU-6(7): { required: true, notes: "Permitted Actions" }
  AU-9(2): { required: true, notes: "Store on Separate Physical Systems" }
  AU-9(3): { required: true, notes: "Cryptographic Protection" }
  AU-10: { required: true, notes: "Non-repudiation" }
  AU-12(1): { required: true, notes: "System-Wide/Time-Correlated Audit Trail" }
