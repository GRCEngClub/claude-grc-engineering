# FedRAMP Rev5 Class B control list
#
# The control IDs come from FedRAMP's machine-readable Consolidated Rules for 2026
# (CR26), dataset version 2026.11.02.01, rule FRC-CSF-BSL, Class B list:
#   https://github.com/FedRAMP/rules (file fedramp-consolidated-rules.json)
# When FedRAMP publishes a new dataset version, update this file from the dataset.
#
# The "notes" text is a short control title for readers. It is not FedRAMP text.
# Titles added in this revision are from the NIST SP 800-53 Rev. 5 catalog (release 5.2.0).
#
# The file name and the framework ID fedramp-low are kept so existing commands keep
# working. FedRAMP now names this list by Certification Class, not by impact level.

name: FedRAMP Rev5 Class B Baseline
version: Rev5
description: |
  The 155 NIST SP 800-53 Rev. 5 controls that a provider seeking a FedRAMP Rev5 Class B
  Certification must include, at a minimum, in its Security Decision Record (rule FRC-CSF-BSL).
  Rev5 is FedRAMP's legacy Certification Type. Class B loosely aligns with the former Low
  impact level, and FedRAMP says the two are not the same thing. FedRAMP stops accepting
  applications for new Rev5 Certifications on 2027-06-11.

source: https://github.com/FedRAMP/rules
dataset_version: "2026.11.02.01"
source_rule: FRC-CSF-BSL
certification_type: Rev5
certification_class: B
loosely_aligned_impact_level: Low
control_count: 155
new_rev5_applications_end: "2027-06-11"
applicable_to:
  - Providers seeking or holding a FedRAMP Rev5 Class B Certification

