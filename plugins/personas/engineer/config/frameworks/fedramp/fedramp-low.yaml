# Cadences that FedRAMP's Consolidated Rules for 2026 set for a Rev5 Class B
# certification, each with the rule it comes from. Every ruleset has its own Rev5
# effective dates; read the "effective" blocks in the dataset before treating a
# cadence as already in force. The rules set no fixed penetration test frequency.
fedramp_additional:
  ongoing_certification_report: { cadence: "every 3 months", force: MUST, rule: CCM-OCR-AVL }
  vulnerability_activity_report: { cadence: "at least monthly, human-readable", force: MUST, rule: VER-TFR-MHR }
  machine_verification_and_validation: { cadence: "at least once every month", force: SHOULD, rule: VDR-TFR-MVF }
  non_machine_verification_and_validation: { cadence: "at least once every 3 months", force: MUST, rule: VDR-TFR-NMV }
  vulnerability_detection:
    representative_samples: { cadence: "at least once every 7 days", force: SHOULD, rule: VDR-TFR-PSD }
    resources_likely_to_drift: { cadence: "at least once every month", force: SHOULD, rule: VDR-TFR-PDD }
    resources_not_likely_to_drift: { cadence: "at least once every 6 months", force: SHOULD, rule: VDR-TFR-PCD }
  independent_assessment:
    cadence: "at least once every year"
    force: MUST
    rule: IVV-CSO-FIA
    controls_assessed_every_year: 35  # rule IVV-CSF-AIA
    all_controls_assessed_within: "3 years"  # rule IVV-CSF-MCA
  certification_package_maintenance: { cadence: "at least once every year", force: MUST, rule: CPO-CSF-CPM }
